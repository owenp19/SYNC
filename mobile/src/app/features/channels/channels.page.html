<ion-menu contentId="main-content" side="start" menuId="main-menu">
  <ion-header>
    <ion-toolbar class="menu-toolbar">
      <img class="menu-logo" src="assets/branding/logos/sync_logo_horizontal_white.png" alt="SYNC">
    </ion-toolbar>
  </ion-header>
  <ion-content class="menu-content">
    <nav class="menu-nav">
      <a class="menu-item active" href="/channels">
        <ion-icon name="grid-outline"></ion-icon>
        <span>Canales</span>
      </a>
      <a class="menu-item disabled">
        <ion-icon name="warning-outline"></ion-icon>
        <span>Emergencias</span>
        <small class="soon">Pronto</small>
      </a>
      <a class="menu-item disabled">
        <ion-icon name="person-circle-outline"></ion-icon>
        <span>Perfil</span>
        <small class="soon">Pronto</small>
      </a>
    </nav>
  </ion-content>
</ion-menu>

<ion-header class="channels-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button>
        <ion-icon name="menu-outline"></ion-icon>
      </ion-menu-button>
    </ion-buttons>
    <div class="toolbar-brand">
      <img src="assets/branding/logos/sync_logo_horizontal_white.png" alt="SYNC">
    </div>
    <ion-buttons slot="end">
      <ion-button fill="clear" class="live-pill">
        <span class="live-dot"></span> LIVE
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content id="main-content" class="channels-page" fullscreen>

  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="hero">
    <p class="eyebrow">HOTEL &amp; STAFF · OPERACIONES</p>
    <h1>Canales</h1>
    <p class="subtitle">Selecciona un departamento para entrar al canal de voz.</p>

    <label class="dept">
      <span>Soy de</span>
      <select (change)="onDeptChange($event)">
        <option *ngFor="let d of departments" [value]="d" [selected]="d === department">{{ d }}</option>
      </select>
    </label>
  </div>

  <div class="alert" *ngIf="loadError$ | async as loadError">
    <ion-icon name="warning-outline"></ion-icon>
    <span>{{ loadError }}</span>
  </div>

  <ng-container *ngIf="channels$ | async as channels">
    <div class="empty" *ngIf="channels.length === 0 && !(loadError$ | async)">
      <ion-icon name="wifi-outline"></ion-icon>
      <p>Cargando canales…</p>
    </div>

    <div class="channel-list">
      <button class="channel-card" *ngFor="let c of channels; let i = index" (click)="open(c)" [style.animation-delay]="i * 60 + 'ms'">
      <div class="icon-wrap" [style.background]="c.color + '1F'" [style.color]="c.color">
        <ion-icon [name]="c.icon"></ion-icon>
      </div>

      <div class="channel-info">
        <div class="name-row">
          <strong>{{ c.name }}</strong>
        </div>
        <small>{{ c.description }}</small>
        <span class="status" [class.busy]="c.status === 'busy'" [class.emergency]="c.type === 'emergency' && c.status !== 'busy'">
          <span class="dot"></span>{{ statusLabel(c) }}
        </span>
        <small class="occupier" *ngIf="c.status === 'busy' && c.occupier_name">En uso por {{ c.occupier_name }}</small>
      </div>

      <span class="chevron-wrap">
        <ion-icon name="chevron-forward"></ion-icon>
      </span>
    </button>
    </div>
  </ng-container>

</ion-content>
