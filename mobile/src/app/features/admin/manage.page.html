<ion-header class="manage-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin" text=""></ion-back-button>
    </ion-buttons>
    <img class="brand-img" src="assets/branding/logos/sync_logo_horizontal_white.png" alt="SYNC">
  </ion-toolbar>
</ion-header>

<ion-content class="manage-page" fullscreen>
  <div class="hero">
    <p class="eyebrow">ADMINISTRACIÓN</p>
    <h1>Crear</h1>
    <p class="subtitle">Agrega canales y departamentos a la operación.</p>
  </div>

  <div class="card">
    <h3>Nuevo departamento</h3>
    <ion-item lines="none" class="field">
      <ion-input label="Nombre" labelPlacement="floating" [(ngModel)]="deptName" placeholder="Ej. Recepción"></ion-input>
    </ion-item>
    <ion-button expand="block" class="cta" (click)="createDepartment()">
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      Crear departamento
    </ion-button>
    <p class="note">Al crearlo también se crea su canal de voz asociado.</p>
    <ion-button expand="block" class="cta-outline" (click)="seedDepartments()">
      Cargar departamentos base
    </ion-button>
  </div>

  <div class="card">
    <h3>Nuevo canal</h3>
    <ion-item lines="none" class="field">
      <ion-input label="Nombre" labelPlacement="floating" [(ngModel)]="channelName" placeholder="Ej. Almacén"></ion-input>
    </ion-item>
    <ion-item lines="none" class="field field-select">
      <ion-label>Tipo</ion-label>
      <ion-select [(ngModel)]="channelType" interface="popover">
        <ion-select-option value="private">Privado</ion-select-option>
        <ion-select-option value="general">General</ion-select-option>
        <ion-select-option value="emergency">Emergencia</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-button expand="block" class="cta" (click)="createChannel()">
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      Crear canal
    </ion-button>
  </div>
</ion-content>
