<ion-content fullscreen class="onboarding-page">

  <div class="screen-container">

    <!-- LOGO -->
    <div class="logo-container">
      <img src="assets/branding/logos/sync_isotipo_primary.jpg" alt="SYNC Logo">
    </div>

    <!-- TEXTO PRINCIPAL -->
    <div class="content-text">
      <h1>
        Conecta tu equipo.
        <span>Todo en un solo canal.</span>
      </h1>

      <p>
        Comunicación instantánea, segura y eficiente para hoteles y organizaciones.
      </p>
    </div>

    <!-- IMAGEN EQUIPO -->
    <div class="hero-image">
      <img src="assets/images/hotel-team.png" alt="Equipo conectado">
    </div>

    <!-- INDICADORES -->
    <div class="dots">
      <span class="active"></span>
      <span></span>
      <span></span>
    </div>

    <!-- BOTON -->
    <button class="start-button" (click)="startApp()">
      <span>Comenzar</span>
      <ion-icon name="arrow-forward-outline"></ion-icon>
    </button>

  </div>

</ion-content>
