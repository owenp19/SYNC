<ion-content class="login-page" fullscreen>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="screen-container">
    <div class="brand">
      <img src="assets/branding/logos/sync_logo_horizontal_white.png" alt="SYNC">
    </div>
    <div class="card">
      <p class="eyebrow">¿QUIÉN ESTÁ UTILIZANDO ESTE DISPOSITIVO?</p>
      <h2>Selecciona tu nombre</h2>
      <button class="operator-btn" *ngFor="let o of operators" (click)="choose(o.id)">
        <ion-icon name="person-circle-outline"></ion-icon> {{ o.name }}
      </button>
      <button class="operator-btn skip" (click)="choose(null)">Continuar sin operador</button>
    </div>
  </div>
</ion-content>
