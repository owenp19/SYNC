<ion-content class="login-page" fullscreen>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="screen-container">

    <div class="brand">
      <img src="assets/branding/logos/sync_logo_horizontal_white.png" alt="SYNC">
      <p class="tag">RADIO DIGITAL EMPRESARIAL · PREMIUM</p>
    </div>

    <div class="card">
      <p class="eyebrow">CONFIGURACIÓN INICIAL</p>
      <h2>Este dispositivo todavía no está registrado</h2>
      <ion-item lines="none" class="field">
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-input label="Código de activación" labelPlacement="floating" [(ngModel)]="code" type="text" placeholder="847291"></ion-input>
      </ion-item>
      <ion-button expand="block" class="login-button" (click)="onActivate()">
        <ion-icon slot="start" name="arrow-forward-outline"></ion-icon>
        Activar
      </ion-button>
      <p class="footnote">El código lo genera el administrador.</p>
    </div>
  </div>
</ion-content>
